<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Carga</title>
    <link rel="stylesheet" href="css/estilos.css">
	<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@400;700&display=swap" rel="stylesheet"> 
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #181818;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .resonance {
            width: 15px;
            height: 100px;
            background-color: #00ffff;
            margin: 0 5px;
            animation: resonate 1s infinite;
        }

        .resonance:nth-child(2) {
            animation-delay: 0.2s;
        }

        .resonance:nth-child(3) {
            animation-delay: 0.4s;
        }

        .resonance:nth-child(4) {
            animation-delay: 0.6s;
        }

        .resonance:nth-child(5) {
            animation-delay: 0.8s;
        }

        @keyframes resonate {
            0%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(2);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
        <div class="resonance"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                window.location.href = "/login";
            }, 3000); 
        });
    </script>
</body>
</html>
